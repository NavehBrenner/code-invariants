name: CI

on:
  push:
    branches: [main]
  pull_request:
  # break-glass: lets ci-hatch.yml (or `gh workflow run ci.yml --ref <branch>`)
  # report `build` on a branch whose PR never got an automatic run.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check
