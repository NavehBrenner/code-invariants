name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# one agent per issue/PR; a second /oc cancels the first instead of racing it
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode:
    # the gate: only you spend the quota. issue_comment runs from the default
    # branch, so a fork PR cannot edit this check.
    if: |
      contains(github.event.comment.body, '/oc') &&
      github.event.comment.user.login == 'NavehBrenner'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # agent needs history to branch/rebase
      # access token only — the refresh token is stripped before this secret is
      # published, so a runner can read xAI but cannot rotate the grant.
      - name: restore opencode auth
        env:
          AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          mkdir -p ~/.local/share/opencode
          install -m 600 /dev/null ~/.local/share/opencode/auth.json
          printf '%s' "$AUTH_JSON" > ~/.local/share/opencode/auth.json
      # ⚠️ TEMPORARY, AND IT COSTS SOMETHING — see the PR that added these two lines.
      #
      # By default the action exchanges an OIDC token for an opencode-agent App token.
      # That exchange is returning a non-JSON error body, which the action mishandles
      # twice: `response.json()` is called inside the `!response.ok` branch (so the
      # real status code is lost to "Failed to parse JSON"), and the catch block calls
      # updateComment() using an Octokit assigned on the line *after* the throw (so it
      # dies on `undefined is not an object (evaluating 'p.rest')`). Neither message
      # names the actual failure.
      #
      # The App itself is fine: installed, repository_selection "selected", not
      # suspended, with issues/contents/pull_requests write. So this bypasses the
      # exchange rather than fixing it.
      #
      # WHAT IT COSTS: events created with GITHUB_TOKEN do not trigger workflows, so
      # ci.yml will NOT run on PRs opencode opens. That is the whole reason the App
      # path was chosen. Revert once the exchange works, or swap GITHUB_TOKEN for a
      # PAT so its PRs are checked.
      - uses: anomalyco/opencode/github@v1.18.18
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: xai/grok-4.6
          # ponytail: plan/build split is one expression, not two workflow files
          agent: ${{ contains(github.event.comment.body, '/oc plan') && 'plan' || 'build' }}
